<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正在生成案件评估报告</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./assets/demo-shell/demo-nav.css?v=20260529">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(37,99,235,.14), transparent 24%),
        radial-gradient(circle at 82% 20%, rgba(20,162,147,.14), transparent 26%),
        linear-gradient(180deg, #f8fbff 0%, #edf4fb 100%);
      color: #0f172a;
    }
    .shell {
      width: min(760px, calc(100vw - 48px));
      padding: 32px 34px;
      border-radius: 24px;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(219,229,240,.9);
      box-shadow: 0 28px 80px rgba(15, 23, 42, .15);
      text-align: center;
    }
    .title {
      font-size: 30px;
      font-weight: 900;
      margin: 0 0 14px;
    }
    .desc {
      margin: 0 0 22px;
      color: #64748b;
      font-size: 15px;
      line-height: 1.7;
    }
    .split {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 22px 0 28px;
    }
    .segment {
      min-height: 92px;
      border-radius: 18px;
      border: 1px solid #dbe7f8;
      background: linear-gradient(180deg, #ffffff, #f7fbff);
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #1d4ed8;
      position: relative;
      overflow: hidden;
    }
    .segment::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(37,99,235,.12), transparent);
      transform: translateX(-120%);
      animation: sweep 1.6s linear infinite;
    }
    .segment:nth-child(2)::before { animation-delay: .15s; }
    .segment:nth-child(3)::before { animation-delay: .3s; }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2563eb;
      margin-right: 8px;
      box-shadow: 0 0 0 6px rgba(37,99,235,.12);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 46px;
      padding: 0 18px;
      border-radius: 14px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(37,99,235,.25);
    }
    @keyframes sweep {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    @media (max-width: 720px) {
      .shell { padding: 24px 20px; }
      .title { font-size: 24px; }
      .split { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <h1 class="title">正在生成案件评估报告</h1>
    <p class="desc">系统正在综合问答结果、送达信息和案件要素，生成最终报告页面。</p>
    <div class="split" aria-hidden="true">
      <div class="segment"><span><i class="dot"></i>分析材料</span></div>
      <div class="segment"><span><i class="dot"></i>归纳风险</span></div>
      <div class="segment"><span><i class="dot"></i>生成报告</span></div>
    </div>
    <button class="btn" id="enterReportBtn" type="button">进入报告</button>
  </div>
  <script>
    const btn = document.getElementById('enterReportBtn');
    const go = () => window.location.href = './案件评估报告.html';
    btn.addEventListener('click', go);
    window.setTimeout(go, 1600);
  </script>
  <script src="./assets/demo-shell/demo-config.js?v=20260529"></script>
  <script src="./assets/demo-shell/demo-nav.js?v=20260529"></script>
</body>
</html>
