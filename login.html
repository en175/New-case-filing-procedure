<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 网上立案大厅</title>
  <link rel="icon" href="data:," />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
      color: #1f2937;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background-color: #0b1220;
      background-image: url('./图片/lgbc.png');
      background-position: top center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .gradient-text {
      position: absolute;
      top: 5%;
      right: 48px;
      opacity: 0.8;
      color: #ffffff;
      font-size: 30px;
      line-height: 1.625;
      font-weight: 700;
      min-width: max-content;
      padding: 16px 0;
      text-shadow: 0 0 10px #1e92d5, 0 0 15px #284ccf;
      z-index: 1;
    }

    .main {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      padding: 32px 24px;
      gap: 24px;
    }

    .card {
      width: 100%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      padding: 24px;
      flex-shrink: 0;
      margin-right: 0;
    }

    @media (min-width: 768px) {
      .main { padding-left: 0; padding-right: 0; }
      .card { margin-right: 2.5vw; }
    }

    .tabs { display: flex; flex-direction: column; height: 100%; }
    .tab-input { position: absolute; opacity: 0; pointer-events: none; }
    .tab-nav {
      display: flex;
      justify-content: center;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 16px;
    }
    .tab-nav-inner {
      display: flex;
      position: relative;
      width: 240px;
    }
    .tab-nav-inner label {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-weight: 600;
      font-size: 16px;
      color: rgba(0, 0, 0, 0.88);
      cursor: pointer;
      transition: color 0.2s;
    }
    .tab-nav-inner label:hover { color: #1677ff; }
    .tab-ink {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 50%;
      background: linear-gradient(to right, #2563eb, #1d4ed8);
      border-radius: 2px;
      transition: transform 0.3s;
      transform: translateX(0);
    }
    #tab-phone:checked ~ .tab-nav .tab-ink { transform: translateX(100%); }
    #tab-password:checked ~ .tab-nav label[for="tab-password"],
    #tab-phone:checked ~ .tab-nav label[for="tab-phone"] { color: #1677ff; }
    .tab-pane { display: none; }
    #tab-password:checked ~ .tab-panes #pane-password,
    #tab-phone:checked ~ .tab-panes #pane-phone { display: block; }

    .role-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .role-tag {
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #e5e7eb;
      color: #334155;
      background: #ffffff;
      font-weight: 600;
      font-size: 14px;
      line-height: 1;
    }
    .role-tag.selected {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    }

    .form-item { margin-bottom: 16px; flex-shrink: 0; }
    .form-item label.field-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.88);
    }

    .input-wrap {
      display: flex;
      align-items: center;
      width: 100%;
      height: 40px;
      padding: 4px 11px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap:focus-within {
      border-color: #4096ff;
      box-shadow: 0 0 0 2px rgba(5, 145, 255, 0.1);
    }
    .input-wrap .prefix {
      display: flex;
      align-items: center;
      margin-right: 8px;
      color: #94a3b8;
      flex-shrink: 0;
    }
    .input-wrap input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      background: transparent;
      min-width: 0;
    }
    .input-wrap input::placeholder { color: #bfbfbf; }

    .input-group {
      display: flex;
      width: 100%;
    }
    .input-group .input-wrap {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      width: calc(100% - 130px);
      z-index: 1;
    }
    .input-group .btn-code {
      width: 130px;
      min-width: 112px;
      height: 40px;
      border: 1px solid #d9d9d9;
      border-left: none;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      background: #fff;
      color: rgba(0, 0, 0, 0.88);
      font-size: 16px;
      cursor: default;
    }

    .btn-primary {
      display: block;
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: #1677ff;
      color: #fff;
      font-size: 16px;
      font-weight: 400;
      cursor: default;
      box-shadow: 0 2px 0 rgba(5, 145, 255, 0.1);
    }

    .footer-link {
      display: flex;
      align-items: center;
      margin-top: 8px;
    }
    .footer-link a {
      padding: 0;
      font-size: 12px;
      color: #1677ff;
      text-decoration: none;
      background: none;
      border: none;
      cursor: default;
    }

    .icon { width: 16px; height: 16px; display: block; }

    @media (max-width: 640px) {
      .gradient-text {
        right: 16px;
        font-size: 20px;
        max-width: calc(100% - 32px);
        white-space: normal;
      }
    }
  </style>
  <link rel="stylesheet" href="./assets/demo-shell/demo-ppt-nav.css">
</head>
<body>
  <div class="page">
    <div class="gradient-text">为每一起纠纷提供最佳解决方案</div>

    <main class="main">
      <section class="card">
        <div class="tabs">
          <input type="radio" name="login-tab" id="tab-password" class="tab-input" checked>
          <input type="radio" name="login-tab" id="tab-phone" class="tab-input">

          <div class="tab-nav">
            <div class="tab-nav-inner">
              <label for="tab-password">密码登录</label>
              <label for="tab-phone">手机登录</label>
              <div class="tab-ink"></div>
            </div>
          </div>

          <div class="tab-panes">
            <div id="pane-password" class="tab-pane">
              <div class="role-tags">
                <span class="role-tag selected">管理端</span>
                <span class="role-tag">用户端</span>
              </div>

              <div class="form-item">
                <label class="field-label">用户名</label>
                <div class="input-wrap">
                  <span class="prefix">
                    <svg class="icon" viewBox="0 0 1024 1024" fill="currentColor"><path d="M858.5 763.6a374 374 0 0 0-80.6-119.5 375.63 375.63 0 0 0-119.5-80.6c-.4-.2-.8-.3-1.2-.5C719.5 518 760 444.7 760 362c0-137-111-248-248-248S264 225 264 362c0 82.7 40.5 156 102.8 201.1-.4.2-.8.3-1.2.5-44.8 18.9-85 46-119.5 80.6a375.63 375.63 0 0 0-80.6 119.5A371.7 371.7 0 0 0 136 901.8a8 8 0 0 0 8 8.2h60c4.4 0 7.9-3.5 8-7.8 2-77.2 33-149.5 87.8-204.3 56.7-56.7 132-87.9 212.2-87.9s155.5 31.2 212.2 87.9C779 752.7 810 825 812 902.2c.1 4.4 3.6 7.8 8 7.8h60a8 8 0 0 0 8-8.2c-1-47.8-17.9-94.1-48.5-132.4zM512 534c-45.9 0-89.1-17.9-121.6-50.4S340 407.9 340 362c0-45.9 17.9-89.1 50.4-121.6S466.1 190 512 190s89.1 17.9 121.6 50.4S684 316.1 684 362c0 45.9-17.9 89.1-50.4 121.6S557.9 534 512 534z"/></svg>
                  </span>
                  <input type="text" placeholder="请输入用户名" value="" readonly tabindex="-1">
                </div>
              </div>

              <div class="form-item">
                <label class="field-label">密码</label>
                <div class="input-wrap">
                  <span class="prefix">
                    <svg class="icon" viewBox="0 0 1024 1024" fill="currentColor"><path d="M832 464h-68V240c0-70.7-57.3-128-128-128H388c-70.7 0-128 57.3-128 128v224h-68c-17.7 0-32 14.3-32 32v384c0 17.7 14.3 32 32 32h640c17.7 0 32-14.3 32-32V496c0-17.7-14.3-32-32-32zM332 240c0-30.9 25.1-56 56-56h248c30.9 0 56 25.1 56 56v224H332V240zm460 600H232V528h560v312z"/></svg>
                  </span>
                  <input type="password" placeholder="请输入密码" value="" readonly tabindex="-1">
                </div>
              </div>

              <div class="form-item">
                <button type="button" class="btn-primary">登录</button>
              </div>
            </div>

            <div id="pane-phone" class="tab-pane">
              <div class="role-tags">
                <span class="role-tag selected">管理端</span>
                <span class="role-tag">用户端</span>
              </div>

              <div class="form-item">
                <label class="field-label">手机号</label>
                <div class="input-wrap">
                  <span class="prefix">
                    <svg class="icon" viewBox="0 0 1024 1024" fill="currentColor"><path d="M744 62H280c-35.3 0-64 28.7-64 64v768c0 35.3 28.7 64 64 64h464c35.3 0 64-28.7 64-64V126c0-35.3-28.7-64-64-64zm-8 824H288V126h448v760zM512 918a40 40 0 1 0 0-80 40 40 0 0 0 0 80z"/></svg>
                  </span>
                  <input type="text" placeholder="输入手机号" value="" readonly tabindex="-1">
                </div>
              </div>

              <div class="form-item">
                <label class="field-label">验证码</label>
                <div class="input-group">
                  <div class="input-wrap">
                    <span class="prefix">
                      <svg class="icon" viewBox="0 0 1024 1024" fill="currentColor"><path d="M866.9 169.9L527.1 54.1C523 52.7 517.5 52 512 52s-11 .7-15.1 2.1L157.1 169.9c-8.3 2.8-15.1 12.4-15.1 21.2v482.4c0 8.8 5.7 20.4 12.6 25.9L499.3 968c3.5 2.7 8 4.1 12.6 4.1s9.2-1.4 12.6-4.1l324.1-249.6c6.9-5.4 12.6-17.1 12.6-25.9V191.1c.1-8.8-6.8-18.4-15.1-21.2zM810 654.3L512 886.5 214 654.3V226.7l298-101.6 298 101.6v427.6zM402.9 528.8l-77.5 77.5a8.03 8.03 0 1 0 11.3 11.3l85.6-85.6c4.7-4.7 4.7-12.3 0-17l-85.6-85.6a8.03 8.03 0 0 0-11.3 0l-77.5 77.5a8.03 8.03 0 1 0 11.3 11.3l28.3 28.3-28.3 28.3a8.03 8.03 0 0 0 0 11.3zM564 583.5l85.6-85.6c4.7-4.7 4.7-12.3 0-17l-85.6-85.6a8.03 8.03 0 0 0-11.3 0l-28.3 28.3-28.3-28.3a8.03 8.03 0 0 0-11.3 11.3l85.6 85.6c4.7 4.7 4.7 12.3 0 17l-85.6 85.6a8.03 8.03 0 0 0 11.3 11.3l28.3-28.3 28.3 28.3a8.03 8.03 0 0 0 11.3 0z"/></svg>
                    </span>
                    <input type="text" placeholder="请输入验证码" value="" readonly tabindex="-1">
                  </div>
                  <button type="button" class="btn-code">获取验证码</button>
                </div>
              </div>

              <div class="form-item">
                <button type="button" class="btn-primary">登录</button>
              </div>
            </div>
          </div>
        </div>

        <div class="footer-link">
          <a href="javascript:void(0)">忘记密码？</a>
        </div>
      </section>
    </main>
  </div>
  <script src="./assets/shared/ppt-click-helper.js"></script>
  <script src="./assets/demo-shell/demo-config.js"></script>
  <script src="./assets/demo-shell/demo-nav.js"></script>
  <script src="./assets/demo-shell/demo-ppt-nav.js"></script>
  <script>
    (function () {
      if (typeof window.clickAnywhereToNext !== 'function') return;
      window.clickAnywhereToNext({
        ignore(target) {
          return !!target?.closest?.('.demo-global-nav, .demo-ppt-nav');
        }
      });
    })();
  </script>
</body>
</html>
