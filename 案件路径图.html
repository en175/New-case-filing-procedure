<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>调解仲裁路径说明</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

    :root {
      --ink: #102033;
      --muted: #64748b;
      --soft: #8a9ab0;
      --wash: #f4f7fb;
      --blue: #2563eb;
      --blue-soft: #e9f1ff;
      --teal: #059669;
      --teal-soft: #e7f8ef;
      --shadow: 0 24px 70px rgba(25,39,66,.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; min-height: 100%;
      font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
      color: var(--ink); background: var(--wash);
    }

    .system-page {
      min-height: 100vh; display: grid; grid-template-rows: 60px 1fr;
      background:
        radial-gradient(circle at 12% 12%,rgba(37,99,235,.09),transparent 30%),
        radial-gradient(circle at 88% 8%,rgba(16,161,147,.1),transparent 28%),
        linear-gradient(180deg,#f8fbff 0%,#eef4f8 100%);
    }

    .system-topbar {
      position: sticky; top: 0; height: 60px; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #dbe3ee; background: rgba(255,255,255,.9);
      backdrop-filter: blur(18px); box-shadow: 0 8px 24px rgba(15,23,42,.06); z-index: 10;
    }

    .brand, .top-actions, .score { display: flex; align-items: center; }
    .brand { gap: 12px; }
    .top-actions { gap: 18px; color: #13233a; font-weight: 900; }
    .score { gap: 8px; color: #f59e0b; }

    .brand-mark {
      width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
      color: #fff; background: linear-gradient(145deg,#2367e8,#1746b3);
      box-shadow: 0 10px 22px rgba(35,103,232,.22); font-size: 20px;
    }

    .brand-org   { color: #6b7a90; font-size: 12px; line-height: 1.1; font-weight: 800; }
    .brand-title { margin-top: 3px; color: #13233a; font-size: 16px; line-height: 1.1; font-weight: 900; }

    .score-pill {
      border: 0; border-radius: 999px; padding: 10px 20px; color: #fff;
      background: linear-gradient(135deg,#2367e8,#4455e8); font-weight: 900;
      box-shadow: 0 12px 24px rgba(35,103,232,.24);
    }

    .medal {
      width: 40px; height: 40px; border-radius: 999px; border: 2px solid #d8e2ef;
      display: grid; place-items: center; color: #94a3b8; background: #f8fafc;
    }

    /* ─── Layout ─── */
    .work-area {
      position: relative; padding: 28px 44px 60px; overflow: hidden;
      background:
        linear-gradient(180deg,rgba(239,244,248,.1),rgba(20,39,51,.32)),
        radial-gradient(circle at 18% 22%,rgba(255,255,255,.82),transparent 28%),
        radial-gradient(circle at 78% 20%,rgba(160,190,198,.62),transparent 36%),
        linear-gradient(135deg,#e9eef3 0%,#b9cbd0 46%,#6f8791 100%);
    }

    .work-area::before {
      content: ""; position: absolute; inset: 20px 34px; border-radius: 28px;
      background:
        linear-gradient(90deg,rgba(18,33,58,.045) 1px,transparent 1px),
        linear-gradient(180deg,rgba(18,33,58,.035) 1px,transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at center,#000 0%,rgba(0,0,0,.82) 56%,transparent 80%);
      pointer-events: none;
    }

    .route-shell {
      position: relative; width: min(1320px,100%); margin: 0 auto; padding: 34px;
      border-radius: 26px; border: 1px solid rgba(219,229,240,.92);
      background:
        linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.92)),
        radial-gradient(circle at 72% 0%,rgba(16,161,147,.1),transparent 34%);
      box-shadow: var(--shadow);
    }

    .page-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 28px; margin-bottom: 22px;
    }

    .page-title { margin: 0; font-size: 38px; line-height: 1.18; font-weight: 900; }
    .page-title span { color: var(--blue); }
    .page-subtitle { margin: 10px 0 0; max-width: 820px; color: var(--muted); font-size: 15px; line-height: 1.8; }

    .back-link {
      flex: none; height: 44px; padding: 0 17px; border-radius: 14px;
      border: 1px solid #d9e3f0; display: inline-flex; align-items: center; gap: 9px;
      color: #1d4ed8; background: #f8fbff; font-size: 13px; font-weight: 900;
      text-decoration: none; transition: transform .18s, box-shadow .18s;
    }

    .back-link:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(37,99,235,.1); }

    .case-card {
      display: grid; grid-template-columns: 1fr; gap: 0; align-items: stretch;
      padding: 18px; border-radius: 20px; border: 1px solid #dce7f2;
      background: linear-gradient(90deg,#f8fbff,#f6fbfa),
        radial-gradient(circle at right center,rgba(16,161,147,.12),transparent 30%);
      margin-bottom: 20px;
    }

    .case-id { display: flex; align-items: center; gap: 14px; padding-right: 0; border-right: 0; }

    .case-icon {
      width: 58px; height: 58px; border-radius: 17px; display: grid; place-items: center;
      color: var(--teal); background: var(--teal-soft); font-size: 24px;
    }

    .case-id span { display: block; color: var(--soft); font-size: 12px; font-weight: 900; }
    .case-id strong { display: block; margin-top: 6px; font-size: 18px; line-height: 1.35; font-weight: 900; }

    /* ─── Timeline board ─── */
    .timeline-board {
      position: relative; padding: 22px 22px 30px; border-radius: 24px;
      border: 1px solid #dce7f2;
      background: radial-gradient(circle at 82% 8%,rgba(37,99,235,.12),transparent 28%),
        linear-gradient(180deg,#fbfdff 0%,#ffffff 100%);
      box-shadow: 0 18px 48px rgba(20,37,60,.08); overflow: hidden;
    }

    .timeline-board::before {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(90deg,rgba(16,32,51,.035) 1px,transparent 1px),
        linear-gradient(180deg,rgba(16,32,51,.035) 1px,transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(circle at center,#000 0%,rgba(0,0,0,.54) 58%,transparent 84%);
      pointer-events: none;
    }

    .timeline-head {
      position: sticky; top: 60px; z-index: 3;
      display: grid; grid-template-columns: minmax(0,1fr) 130px minmax(0,1fr);
      gap: 18px; align-items: center;
      margin: -4px 0 20px; padding: 12px; border-radius: 18px;
      background: rgba(255,255,255,.88); backdrop-filter: blur(14px);
      border: 1px solid rgba(220,230,240,.8);
    }

    .track-title {
      height: 56px; border-radius: 16px; display: flex; align-items: center;
      justify-content: center; gap: 10px; font-size: 19px; font-weight: 900;
    }

    .track-title i { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; }

    .track-title.arbitration {
      color: #047857; background: linear-gradient(135deg,#e7f8ef,#f6fffa);
      border: 1px solid rgba(5,150,105,.2);
    }

    .track-title.arbitration i { background: #fff; }

    .track-title.mediation {
      color: #1d4ed8; background: linear-gradient(135deg,#e9f1ff,#f7fbff);
      border: 1px solid rgba(37,99,235,.18); box-shadow: 0 18px 38px rgba(37,99,235,.14);
    }

    .track-title.mediation i { background: #fff; }

    .center-label { text-align: center; color: #64748b; font-size: 12px; line-height: 1.5; font-weight: 900; }

    /* ─── Timeline ─── */
    .timeline { position: relative; display: grid; gap: 26px; }
    .route-next-actions {
      display: none;
      justify-content: flex-end;
      margin-top: 22px;
      position: relative;
      z-index: 2;
    }
    .route-next-actions.show {
      display: flex;
      animation: fadeInUp .35s ease both;
    }
    .route-next-btn {
      border: none;
      border-radius: 12px;
      background: #153f95;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      padding: 13px 20px;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(21, 63, 149, .22);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .route-next-btn:hover {
      transform: translateY(-1px);
      background: #1d4db1;
      box-shadow: 0 18px 36px rgba(21, 63, 149, .28);
    }

    /* Flowing light line (separate element for overflow:hidden clipping) */
    .timeline-glow-line {
      position: absolute; left: 50%; top: 0; bottom: 0;
      width: 2px; transform: translateX(-50%);
      overflow: hidden; pointer-events: none; z-index: 0;
    }

    .timeline-glow-line::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, #c8d6e6 0%, #7aa7ff 50%, #dce6f0 100%);
    }

    .timeline-glow-line::after {
      content: ""; position: absolute;
      left: 0; width: 100%; height: 90px; top: -90px;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(147,197,253,.75) 25%,
        rgba(255,255,255,.98) 50%,
        rgba(147,197,253,.75) 75%,
        transparent 100%
      );
      animation: flowDown 2.8s linear infinite;
    }

    @keyframes flowDown {
      0%   { top: -90px; }
      100% { top: 100%; }
    }

    /* ─── Time row states ─── */
    .time-row {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: minmax(0,1fr) 130px minmax(0,1fr);
      gap: 22px; align-items: stretch;
      opacity: 0;
    }

    /* Panels hidden unless row is revealing or revealed.
       Uses :not() to beat .path-panel.med-silent {opacity:.72} specificity. */
    .time-row:not(.revealed):not(.revealing) .path-panel {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* State 1: entering */
    @keyframes rowEnter {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .time-row.entering { animation: rowEnter 0.42s cubic-bezier(0.22,1,0.36,1) forwards; }

    /* State 2: pending — row visible, panels still hidden, time pill pulses */
    .time-row.pending { opacity: 1; }

    .time-row.pending .time-pill {
      cursor: pointer;
      animation: pillGlow 1.8s ease-in-out infinite;
      border-color: #93c5fd;
      background: linear-gradient(135deg,#eff6ff,#f8fbff);
    }

    @keyframes pillGlow {
      0%   { box-shadow: 0 0 0 0 rgba(37,99,235,.5), 0 8px 20px rgba(20,37,60,.08); transform: scale(1); }
      40%  { box-shadow: 0 0 0 12px rgba(37,99,235,.1), 0 0 24px 8px rgba(37,99,235,.2); transform: scale(1.06); }
      100% { box-shadow: 0 0 0 22px rgba(37,99,235,.0), 0 8px 20px rgba(20,37,60,.08); transform: scale(1); }
    }

    .time-row.pending .time-pill .pill-hint {
      display: block; font-size: 10px; color: var(--blue); margin-top: 6px;
      font-weight: 900; animation: hintBlink 1.8s ease-in-out infinite;
    }

    @keyframes hintBlink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    /* State 3: revealing — clip-path curtain from center outward, no content distortion */
    .time-row.revealing { opacity: 1; }

    .time-row.revealing .path-panel.arbitration {
      animation: curtainArb 0.88s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .time-row.revealing .path-panel.med-silent {
      animation: curtainMed 0.88s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
    }

    .time-row.revealing .path-panel.mediation,
    .time-row.revealing .path-panel.med-complete {
      animation: curtainMed 0.88s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
    }

    /* Left panel reveals right→left (from center outward) */
    @keyframes curtainArb {
      0%   { opacity: 0; clip-path: inset(0 100% 0 0 round 20px); }
      18%  { opacity: 1; }
      100% { opacity: 1; clip-path: inset(0 0% 0 0 round 20px); }
    }

    /* Right panel reveals left→right (from center outward) */
    @keyframes curtainMed {
      0%   { opacity: 0; clip-path: inset(0 0 0 100% round 20px); }
      18%  { opacity: 1; }
      100% { opacity: 1; clip-path: inset(0 0 0 0% round 20px); }
    }

    /* State 4: revealed */
    .time-row.revealed { opacity: 1; }
    .time-row.revealed .path-panel {
      pointer-events: auto; clip-path: none;
      /* opacity left to each panel's own rule: med-silent=0.72, others=1 */
    }

    /* ─── Time node ─── */
    .time-node { position: relative; display: grid; place-items: center; }

    .time-pill {
      width: 112px; padding: 14px 8px 12px; border-radius: 20px;
      border: 1px solid #dbe7f2; background: rgba(255,255,255,.96);
      box-shadow: 0 12px 28px rgba(20,37,60,.08); text-align: center;
      transition: border-color .2s, background .2s;
    }

    .time-pill .pill-label { display: block; color: #1d4ed8; font-size: 13px; font-weight: 900; line-height: 1.3; }
    .time-pill .pill-sub   { display: block; color: #94a3b8; font-size: 11px; font-weight: 900; margin-top: 4px; line-height: 1.3; }
    .time-pill .pill-hint  { display: none; } /* shown only in .pending via rule above */

    /* ─── Path panels ─── */
    .path-panel {
      position: relative; min-height: 158px; padding: 20px; border-radius: 20px;
      border: 1px solid #dfe8f2; background: rgba(255,255,255,.95);
      box-shadow: 0 16px 38px rgba(20,37,60,.07);
    }

    .path-panel::before {
      content: ""; position: absolute; top: 50%; width: 18px; height: 2px; background: #d8e3ee;
    }

    .path-panel.arbitration::before { right: -18px; background: linear-gradient(90deg,#d8e3ee,#059669); }
    .path-panel.mediation::before   { left:  -18px; background: linear-gradient(90deg,var(--blue),#d8e3ee); }
    .path-panel.med-silent::before  { left:  -18px; background: linear-gradient(90deg,#cbd5e1,#d8e3ee); }

    .path-panel.arbitration {
      border-left: 4px solid var(--teal);
      background: radial-gradient(circle at 100% 0%,rgba(5,150,105,.12),transparent 32%), rgba(255,255,255,.94);
    }

    .path-panel.mediation {
      border-left: 5px solid var(--blue);
      background: radial-gradient(circle at 100% 0%,rgba(37,99,235,.14),transparent 34%), rgba(255,255,255,.98);
      box-shadow: 0 24px 52px rgba(37,99,235,.14);
    }

    .path-panel.med-complete {
      border-left: 5px solid #059669;
      background: radial-gradient(circle at 100% 0%,rgba(5,150,105,.2),transparent 40%), rgba(255,255,255,.98);
    }

    @keyframes completedGlow {
      0%   { box-shadow: 0 24px 52px rgba(37,99,235,.14); }
      55%  { box-shadow: 0 0 0 10px rgba(5,150,105,.14), 0 24px 60px rgba(5,150,105,.22); }
      100% { box-shadow: 0 0 0 3px rgba(5,150,105,.1), 0 24px 52px rgba(5,150,105,.14); }
    }

    .path-panel.med-complete.animate-glow { animation: completedGlow .8s ease forwards; }

    .path-panel.med-silent {
      border-left: 4px solid #cbd5e1;
      background: rgba(248,250,252,.75);
      box-shadow: 0 8px 20px rgba(20,37,60,.04);
      opacity: 0.72;
    }

    .path-panel.med-silent h3 { color: #64748b; }
    .path-panel.med-silent .silent-icon {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #64748b;
      background: linear-gradient(180deg,#f8fafc,#e2e8f0);
      border: 1px solid #cbd5e1;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 8px 18px rgba(100,116,139,.12);
      flex: none;
    }

    .panel-kicker {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      color: var(--soft); font-size: 12px; line-height: 1.4; font-weight: 900;
    }

    .panel-kicker i {
      width: 30px; height: 30px; border-radius: 11px; display: grid; place-items: center;
      color: var(--tone); background: var(--tone-soft); flex: none;
    }

    .path-panel h3 { margin: 10px 0 8px; font-size: 18px; line-height: 1.35; font-weight: 900; }
    .path-panel p  { margin: 0; color: #53677f; font-size: 13px; line-height: 1.7; }
    .path-panel.mediation h3    { color: #1d4ed8; }
    .path-panel.med-complete h3 { color: #047857; }
    .path-panel.arbitration h3  { color: #047857; }

    .effect-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .effect-tags span {
      padding: 6px 9px; border-radius: 999px; color: var(--tone); background: var(--tone-soft);
      font-size: 12px; line-height: 1; font-weight: 900;
    }

    .arbitration  { --tone: var(--teal); --tone-soft: var(--teal-soft); }
    .mediation    { --tone: var(--blue); --tone-soft: var(--blue-soft); }
    .med-complete { --tone: #047857;     --tone-soft: #ecfdf5; }
    .med-silent   { --tone: #94a3b8;     --tone-soft: #f1f5f9; }

    /* 时间/金额高亮 */
    .hi {
      display: inline-block; background: linear-gradient(135deg,#fef3c7,#fde68a);
      color: #92400e; font-weight: 900; padding: 1px 6px; border-radius: 5px;
      font-size: .93em; border: 1px solid rgba(251,191,36,.5);
    }

    /* 调解流程至此结束 */
    .complete-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
      border-radius: 999px; background: #ecfdf5; color: #047857; font-size: 12px;
      font-weight: 900; margin-top: 12px; border: 1px solid #6ee7b7;
      animation: completeBadgePulse 2.4s ease-in-out infinite;
    }

    @keyframes completeBadgePulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(5,150,105,.4); transform: scale(1); }
      50%      { box-shadow: 0 0 0 8px rgba(5,150,105,.0); transform: scale(1.04); background: #d1fae5; }
    }

    /* 调解流程即将结束 */
    .near-end-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
      border-radius: 999px; background: #fffbeb; color: #d97706; font-size: 12px;
      font-weight: 900; margin-top: 12px; border: 1px solid #fcd34d;
      animation: nearEndPulse 1.7s ease-in-out infinite;
    }

    @keyframes nearEndPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(217,119,6,.45); }
      50%      { box-shadow: 0 0 0 9px rgba(217,119,6,.0); background: #fef3c7; }
    }

    /* ─── Responsive ─── */
    @media (max-width: 1080px) {
      .work-area { padding: 20px 14px 40px; }
      .route-shell { padding: 24px 18px; }
      .case-card { grid-template-columns: 1fr; }
      .case-id { border-right: 0; padding-right: 0; }
      .timeline-head, .time-row { grid-template-columns: 1fr; }
      .timeline::before { left: 24px; }
      .center-label { display: none; }
      .time-node { justify-items: start; }
      .time-pill { width: 100%; min-height: 0; display: flex; align-items: center; gap: 12px; text-align: left; }
      .path-panel::before { display: none; }
      .system-topbar { height: auto; min-height: 86px; align-items: flex-start; padding: 10px 14px; }
      .time-row.revealing .path-panel.arbitration,
      .time-row.revealing .path-panel.med-silent,
      .time-row.revealing .path-panel.mediation,
      .time-row.revealing .path-panel.med-complete {
        transform-origin: top center;
      }
    }

    @media (max-width: 760px) {
      .page-head { flex-direction: column; }
      .page-title { font-size: 30px; }
      .timeline-board { padding: 16px; }
    }
  </style>

<body>
  <div class="system-page">
    <header class="system-topbar">
      <div class="brand">
        <div class="brand-mark"><i class="fas fa-scale-balanced"></i></div>
        <div>
          <div class="brand-org">广州仲裁委员会</div>
          <div class="brand-title">立案服务部</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="score"><i class="fas fa-star"></i><span>10</span></div>
        <button class="score-pill" type="button">获取积分</button>
        <div class="medal"><i class="fas fa-medal"></i></div>
      </div>
    </header>

    <main class="work-area">
      <section class="route-shell">
        <div class="page-head">
          <div>
            <h1 class="page-title">了解<span>调解</span> / 仲裁路径</h1>
            <p class="page-subtitle">依次点击各时间节点，查看对应阶段发生的事项。</p>
          </div>
          <a class="back-link" href="./立案提交后路径选择.html"><i class="fas fa-arrow-left"></i>返回</a>
        </div>

        <section class="case-card">
          <div class="case-id">
            <div class="case-icon"><i class="fas fa-file-contract"></i></div>
            <div>
              <span>当前案件类型</span>
              <strong>教育培训服务合同退费纠纷</strong>
            </div>
          </div>
        </section>

        <section class="timeline-board">
          <div class="timeline-head">
            <div class="track-title arbitration"><i class="fas fa-gavel"></i>仲裁</div>
            <div class="center-label">路径时间轴</div>
            <div class="track-title mediation"><i class="fas fa-handshake"></i>调解</div>
          </div>

          <div class="timeline" id="timeline">
            <div class="timeline-glow-line" aria-hidden="true"></div>
          </div>
          <div class="route-next-actions" id="routeNextActions">
            <button class="route-next-btn" type="button" id="routeNextBtn">继续下一步填写</button>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script>
    /* ─── Data ─── */
    const NODES = [
      {
        label:"第 1 天", sub:"提交材料",
        arb:{ kicker:"仲裁申请", icon:"fa-file-contract", title:"提交仲裁申请材料",
          body:"申请人提交仲裁申请书、主体证明、仲裁协议、证据目录和相关证据。本案争议金额为 <span class=\"hi\">15,800 元</span>， 仲裁费用需按规则缴纳。",
          tags:["申请书","仲裁协议","需预缴仲裁费"] },
        med:{ kicker:"调解意向", icon:"fa-clipboard-check", title:"同步表达调解意愿",
          body:"申请人可以同步说明愿意先行调解。调解不能单方强制启动，但可以先用较低程序成本试探对方是否有协商空间。",
          tags:["自愿原则","先不进入完整审理成本"] }
      },
      {
        label:"第 1-5 天", sub:"审查与补正",
        arb:{ kicker:"仲裁审查", icon:"fa-folder-open", title:"审查申请与通知补正",
          body:"仲裁机构对申请材料是否符合受理条件进行审查。如材料不完整、主体信息不清、证据不足或仲裁条款存在疑问，申请人需补正后方可继续推进。补正时间会影响整体进度。",
          tags:["通常需3—7个工作日","材料不全需补正","时间可能顺延"] },
        med:{ kicker:"调解联系", icon:"fa-phone-volume", title:"询问对方调解意愿",
          body:"适合调解的案件，可先向对方说明调解程序、成本和可协商方案。若对方明确不同意，不强推调解，保留仲裁路径。",
          tags:["先问意愿","省去盲目推进成本"] }
      },
      {
        label:"第 6-20 天", sub:"送达答辩",
        arb:{ kicker:"仲裁推进", icon:"fa-envelope-open-text", title:"送达通知并进入答辩期",
          body:"案件受理后，仲裁机构将仲裁通知、申请书副本及相关材料送达被申请人。被申请人通常享有答辩期，并可提交答辩意见及证据。如送达不顺利或对方答辩较多，后续周期可能进一步拉长。",
          tags:["受理通知","15日答辩期"] },
        med:{ kicker:"同意调解", icon:"fa-bell", title:"双方同意后进入调解安排",
          body:"若双方均同意调解，可尽快进入调解安排和沟通准备。此时调解的价值是先集中处理退款金额、付款期限和履行安排。",
          tags:["双方自愿","先谈方案"] }
      },
      {
        label:"第 21-35 天", sub:"组庭前",
        arb:{ kicker:"仲裁组庭", icon:"fa-users-gear", title:"选定仲裁员并组成仲裁庭",
          body:"双方按规则选定或委托主任指定仲裁员。普通程序和简易程序的组庭方式不同，常见口径涉及 <span class=\"hi\">10日或15日</span> 的选定期限。",
          tags:["选定仲裁员","组庭准备"] },
        med:{ kicker:"组庭前调解", icon:"fa-comments", title:"集中沟通调解方案",
          body:"组庭前如双方同意调解，可围绕退款金额、履行安排、付款期限、违约责任等争议点集中协商。若能形成方案，可明显节省后续审理时间。",
          tags:["组庭前可调","节省后续审理时间"] }
      },
      {
        label:"第 36-45 天", sub:"调解结果", medComplete:true,
        arb:{ kicker:"仲裁准备", icon:"fa-scale-balanced", title:"调解不影响仲裁准备",
          body:"即使先尝试调解，也应继续保留申请书、证据目录、付款凭证、沟通记录等材料。调解不成时，这些材料可以继续支撑仲裁。",
          tags:["材料复用","不成继续仲裁"] },
        med:{ kicker:"调解结果", icon:"fa-pen-to-square", title:"达成协议或恢复仲裁",
          body:"调解达成的，可根据规则制作调解书，或由当事人申请按和解协议内容作出裁决；调解不成的，仲裁程序继续进行。",
          tags:["可早于裁决形成结果","不成继续仲裁"] }
      },
      {
        label:"第 46 天起", sub:"审理准备",
        arb:{ kicker:"仲裁", icon:"fa-gavel", title:"开庭通知与庭审准备",
          body:"仲裁庭组成后，根据案件情况安排审理方式、开庭通知、证据交换和庭审准备。复杂案件可能补充材料或安排多次沟通。",
          tags:["审理安排","可能增加时间成本"] },
        med:null
      },
      {
        label:"组庭后 4 个月内", sub:"裁决期限",
        arb:{ kicker:"仲裁", icon:"fa-file-signature", title:"裁决作出与履行",
          body:"普通程序裁决一般应在仲裁庭组成之日起 <span class=\"hi\">4个月内</span> 作出；简易程序另有较短期限。确需延长的，按规则履行相应批准程序。",
          tags:["普通程序4个月","简易程序75日","可依法执行"] },
        med:null
      }
    ];

    const MED_SILENT = [
      { title:"调解侧无新增程序节点",
        body:"若已调解成功，本阶段主要按协议或调解书履行；若调解不成，后续重点回到仲裁审理准备。",
        tags:["不强行并行","回到仲裁主线"] },
      { title:"调解侧进入履行或救济",
        body:"达成调解结果后，重点是履行确认；未履行或未达成的，再结合既有材料考虑仲裁或其他救济路径。",
        tags:["履行确认","保留救济"] }
    ];

    /* ─── Build helpers ─── */
    function tags(arr) { return arr.map(t=>`<span>${t}</span>`).join(''); }

    function buildArb(d) {
      return `<article class="path-panel arbitration">
        <div class="panel-kicker"><span>${d.kicker}</span><i class="fas ${d.icon}"></i></div>
        <h3>${d.title}</h3><p>${d.body}</p>
        <div class="effect-tags">${tags(d.tags)}</div>
      </article>`;
    }

    function buildMed(d, complete) {
      const cls = complete ? 'path-panel mediation med-complete' : 'path-panel mediation';
      const id  = complete ? 'id="medCompletePanel"' : '';
      const badge = complete
        ? `<div class="complete-badge"><i class="fas fa-circle-check"></i>调解流程至此结束</div>` : '';
      const nearBadge = d.nearEnd
        ? `<div class="near-end-badge"><i class="fas fa-hourglass-half"></i>调解流程即将结束</div>` : '';
      return `<article class="${cls}" ${id}>
        <div class="panel-kicker"><span>${d.kicker}</span><i class="fas ${d.icon}"></i></div>
        <h3>${d.title}</h3><p>${d.body}</p>
        <div class="effect-tags">${tags(d.tags)}</div>
        ${nearBadge}${badge}
      </article>`;
    }

    let silentIdx = 0;
    function buildMedSilent() {
      const d = MED_SILENT[Math.min(silentIdx++, MED_SILENT.length - 1)];
      return `<article class="path-panel med-silent">
        <div class="panel-kicker"><span>调解 · 无新增节点</span><i class="fas fa-pause silent-icon" aria-hidden="true"></i></div>
        <h3>${d.title}</h3><p>${d.body}</p>
        <div class="effect-tags">${tags(d.tags)}</div>
      </article>`;
    }

    function buildPill(node, pending) {
      const hint = pending ? `<span class="pill-hint">点击展开</span>` : '';
      return `<div class="time-node">
        <div class="time-pill">
          <span class="pill-label">${node.label}</span>
          <span class="pill-sub">${node.sub}</span>
          ${hint}
        </div>
      </div>`;
    }

    /* ─── State machine ─── */
    const timeline = document.getElementById('timeline');

    function insertRow(idx, pending) {
      const node = NODES[idx];
      let medHTML;
      if (node.medComplete) medHTML = buildMed(node.med, true);
      else if (node.med === null) medHTML = buildMedSilent();
      else medHTML = buildMed(node.med, false);

      timeline.insertAdjacentHTML('beforeend',
        `<div class="time-row" id="row-${idx}">
          ${buildArb(node.arb)}
          ${buildPill(node, pending)}
          ${medHTML}
        </div>`
      );

      const row = document.getElementById(`row-${idx}`);

      // Slide the row in
      row.classList.add('entering');
      const ENTER_MS = 420;

      setTimeout(() => {
        row.classList.remove('entering');
        if (pending) {
          row.classList.add('pending');
          row.querySelector('.time-pill').addEventListener('click', () => revealRow(idx), { once: true });
        } else {
          // Row 0: auto-reveal after brief pause
          setTimeout(() => revealRow(idx), 200);
        }
      }, ENTER_MS);
    }

    function revealRow(idx) {
      const row = document.getElementById(`row-${idx}`);
      row.classList.remove('pending');
      row.classList.add('revealing');

      const REVEAL_MS = 1020; // curtain: 0.88s + 0.1s delay + buffer

      setTimeout(() => {
        row.classList.remove('revealing');
        row.classList.add('revealed');

        // Special: medComplete effects
        if (NODES[idx].medComplete) {
          setTimeout(() => {
            const panel = document.getElementById('medCompletePanel');
            if (panel) panel.classList.add('animate-glow');
          }, 300);
        }

        // Insert next row.
        if (idx + 1 < NODES.length) {
          setTimeout(() => {
            insertRow(idx + 1, true);
            setTimeout(() => {
              const next = document.getElementById(`row-${idx + 1}`);
              if (next) next.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 420);
          }, 120);
        } else {
          const actions = document.getElementById('routeNextActions');
          if (actions) actions.classList.add('show');
        }
      }, REVEAL_MS);
    }

    // Boot: insert row 0 (auto-reveal, no click needed)
    insertRow(0, false);
    document.getElementById('routeNextBtn')?.addEventListener('click', () => {
      window.location.href = './Step5CaseInfoConfirmation.html';
    });

  </script>
  <script src="./assets/demo-shell/demo-config.js?v=20260529"></script>
  <script src="./assets/demo-shell/demo-nav.js?v=20260529"></script>
</body>
</html>
