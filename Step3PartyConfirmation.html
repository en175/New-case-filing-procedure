    function renderArrayField(item, field, label, placeholder, max = 3) {
      const arr = item[field] || ['']
      return `

          <label>${label}</label>
          <div class="array-row">
            ${arr.map((v, i) => `
              <div class="array-item">
                <input data-array-field="${field}" data-array-index="${i}" value="${esc(v)}" placeholder="${esc(placeholder)}" />
                ${arr.length > 1 ? `<button class="tiny-btn" data-array-remove="${field}" data-array-index="${i}">删除</button>` : ''}

    function renderUploadField(kind, itemId, field, title, extHint, files) {
      const isImageField = imageUploadFields.has(field)
      const hintText = isImageField ? '支持 jpg、jpeg、png，最大50M' : extHint
      const safeFiles = Array.isArray(files) ? files : []
      const filesHtml = safeFiles.length ? (isImageField ? `
        <div class="upload-file-list images">
          ${safeFiles.map(f => `
            <div class="upload-image-item">
              <div class="upload-image-preview">
                <img src="${f.objectURL}" alt="${esc(f.name)}" />
              </div>
              <div class="upload-image-name" title="${esc(f.name)}">${esc(f.name)}</div>
              <div class="upload-image-actions">
                <i class="el-icon-view" data-file-action="preview" data-kind="${kind}" data-id="${itemId}" data-field="${field}" data-file-id="${f.id}"></i>
                <i class="el-icon-download" data-file-action="download" data-kind="${kind}" data-id="${itemId}" data-field="${field}" data-file-id="${f.id}"></i>
                <i class="el-icon-delete danger" data-file-action="remove" data-kind="${kind}" data-id="${itemId}" data-field="${field}" data-file-id="${f.id}"></i>
              </div>
            </div>
          `).join('')}
        </div>
      ` : `
        <div class="upload-file-list docs">
          ${safeFiles.map(f => `
            <div class="upload-file-item">
              <div class="file-meta">
                <i class="el-icon-document" style="color:#3b82f6;"></i>
                <div style="min-width:0;flex:1;">

              </div>
              <div class="file-actions">
                <i class="el-icon-view" data-file-action="preview" data-kind="${kind}" data-id="${itemId}" data-field="${field}" data-file-id="${f.id}"></i>
                <i class="el-icon-download" data-file-action="download" data-kind="${kind}" data-id="${itemId}" data-field="${field}" data-file-id="${f.id}"></i>

      return `

                <div class="special-auth-box">

                  ${specialAuthOptions.map(opt => `

            <div class="field full">

    function renderCard(item, idx, kind) {
      const isAgent = kind === 'agent'
      const role = isAgent ? '代理人' : '申请人'
      const avatorClass = isAgent ? 'avatar-icon agent-avator-icon' : 'avatar-icon'
      const tagText = isAgent ? item.type : item.nature

        <div class="form-card" data-kind="${kind}" data-id="${item.id}">

            </div>
          </div>
          ${item.expanded ? (isAgent ? renderAgentBody(item) : renderApplicantBody(item)) : ''}

    function render() {
      document.getElementById('applicantList').innerHTML = state.applicants.map((item, idx) => renderCard(item, idx, 'applicant')).join('')
      document.getElementById('agentList').innerHTML = state.agents.map((item, idx) => renderCard(item, idx, 'agent')).join('')
      bindCardEvents()
    }

    function bindCardEvents() {
      document.querySelectorAll('.form-card').forEach(card => {
        const kind = card.dataset.kind
        const item = getItem(kind, card.dataset.id)
        card.querySelector('[data-action="delete"]').onclick = () => {
          const list = kind === 'applicant' ? state.applicants : state.agents
          if (kind === 'applicant' && list.length <= 1) return alert('至少保留一个申请人')
          const idx = list.findIndex(x => x.id === item.id)
          list.splice(idx, 1)
          render()
        }
        card.querySelector('[data-action="toggle"]').onclick = () => {
          item.expanded = !item.expanded
          render()
        }

        card.querySelectorAll('[data-field]:not([data-upload-input])').forEach(el => {
          const field = el.dataset.field
          if (field === 'principals') {
            el.onchange = () => {
              item.principals = Array.from(el.selectedOptions).map(op => op.value)
              item.saved = false
            }
            return
          }
          el.onchange = () => {
            item[field] = el.value
            item.saved = false
            if (kind === 'applicant' && field === 'nature') {
              const keep = { id: item.id, expanded: true, saved: false }
              Object.assign(item, createApplicant(), keep, { nature: item.nature, nationality: '中国' })
              render()
              return
            }
            if (kind === 'agent' && field === 'type') {
              const keep = { id: item.id, expanded: true, saved: false }
              Object.assign(item, createAgent(), keep, { type: item.type })
              render()
              return
            }
            if (kind === 'applicant' && field === 'registrationFType') {
              item.registrationSType = ''
              render()
              return
            }
            if (kind === 'applicant' && field === 'industryFirst') {
              item.industrySelected = ''
              render()
              return
            }
            if (kind === 'agent' && field === 'power') {
              render()
              return
            }
          }
          if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
            el.oninput = () => { item[field] = el.value; item.saved = false }
          }
        })

        card.querySelectorAll('[data-array-input]').forEach(el => {
          const field = el.dataset.arrayField
          const index = Number(el.dataset.arrayIndex)
          el.oninput = () => {
            item[field][index] = el.value
            item.saved = false
          }
        })
        card.querySelectorAll('[data-array-add]').forEach(btn => {
          const field = btn.dataset.arrayAdd
          btn.onclick = () => {
            const arr = item[field] || (item[field] = [''])
            const max = field.includes('email') ? LIMITS.emailsCountMax : LIMITS.addressesCountMax
            if (arr.length >= max) return
            arr.push('')
            item.saved = false
            render()
          }
        })
        card.querySelectorAll('[data-array-remove]').forEach(btn => {
          const field = btn.dataset.arrayRemove
          const index = Number(btn.dataset.arrayIndex)
          btn.onclick = () => {
            const arr = item[field]
            if (!arr || arr.length <= 1) return
            arr.splice(index, 1)
            item.saved = false
            render()
          }
        })
        card.querySelectorAll('[data-action="addIndustry"]').forEach(btn => {
          btn.onclick = e => {
            e.preventDefault()
            const value = item.industrySelected
            if (!value) return
            if (item.industryClassification.includes(value)) return
            if (item.industryClassification.length >= LIMITS.industryMax) return alert('最多只能选择6个行业分类')
            item.industryClassification.push(value)
            item.industrySelected = ''
            render()
          }
        })
        card.querySelectorAll('[data-action="removeIndustry"]').forEach(icon => {
          icon.onclick = () => {
            const idx = Number(icon.dataset.industryIndex)
            item.industryClassification.splice(idx, 1)
            render()
          }
        })
        card.querySelectorAll('[data-special-auth]').forEach(ck => {
          ck.onchange = () => {
            const val = ck.dataset.specialAuth
            if (ck.checked) {
              if (!item.powerDetail.includes(val)) item.powerDetail.push(val)
            } else {
              item.powerDetail = item.powerDetail.filter(x => x !== val)
            }
            item.saved = false
            render()
          }
        })
        card.querySelectorAll('[data-agent-power]').forEach(radio => {
          radio.onchange = () => {
            item.power = radio.value
            item.saved = false
            if (item.power === '一般授权') item.powerDetail = []
            if (item.power === '特别授权' && !item.powerDetail.length) item.powerDetail = [...specialAuthOptions]
            render()
          }
        })
        card.querySelectorAll('[data-upload-trigger]').forEach(btn => {
          btn.onclick = e => {
            e.stopPropagation()
            const input = card.querySelector(`[data-upload-input][data-field="${btn.dataset.field}"]`)
            if (input) input.click()
          }
        })
        card.querySelectorAll('[data-upload-dropzone]').forEach(zone => {
          zone.onclick = e => {
            if (e.target.closest('[data-upload-trigger]')) return
            const input = card.querySelector(`[data-upload-input][data-field="${zone.dataset.field}"]`)
            if (input) input.click()
          }
        })
        card.querySelectorAll('[data-upload-input]').forEach(input => {
          input.onchange = e => {
            const field = input.dataset.field
            const files = Array.from(e.target.files || []).map(createFileRecord)
            const currentItem = getItem(input.dataset.kind, input.dataset.id)
            if (!currentItem) return
            if (!Array.isArray(currentItem[field])) currentItem[field] = []
            currentItem[field].push(...files)
            currentItem.saved = false
            input.value = ''
            render()
          }
        })
      })

      document.querySelectorAll('[data-file-action]').forEach(icon => {
        icon.onclick = e => {
          e.stopPropagation()
          const kind = icon.dataset.kind
          const item = getItem(kind, icon.dataset.id)
          if (!item) return
          const field = icon.dataset.field
          const fileList = Array.isArray(item[field]) ? item[field] : []
          const file = fileList.find(f => f.id === icon.dataset.fileId)
          if (!file) return
          const action = icon.dataset.fileAction
          if (action === 'preview') previewFile(file)
          if (action === 'download') downloadFile(file)
          if (action === 'remove') {
            if (file.objectURL) URL.revokeObjectURL(file.objectURL)
            item[field] = fileList.filter(f => f.id !== file.id)
            item.saved = false
            render()
          }
        }
      })
    }

    function applyQuickFillApplicant(item) {
      if (!item.quickFillId) return
      const data = applicantProfiles.find(p => p.id === item.quickFillId)
      if (!data) return
      const keep = { id: item.id, expanded: true, saved: false }
      const next = createApplicant()
      Object.assign(item, next, keep, JSON.parse(JSON.stringify(data)))
      if (!item.mobileList || !item.mobileList.length) item.mobileList = ['']
      if (!item.emailList || !item.emailList.length) item.emailList = ['']
      if (!item.otherAddress || !item.otherAddress.length) item.otherAddress = ['']
    }
    function applyQuickFillAgent(item) {
      if (!item.quickFillId) return
      const data = agentProfiles.find(p => p.id === item.quickFillId)
      if (!data) return
      const keep = { id: item.id, expanded: true, saved: false }
      const next = createAgent()
      Object.assign(item, next, keep, JSON.parse(JSON.stringify(data)))
      item.principals = state.applicants.filter(a => a.saved).map(a => a.id)
      if (!item.mobileList || !item.mobileList.length) item.mobileList = ['']
      if (!item.emailList || !item.emailList.length) item.emailList = ['']
    }

    document.addEventListener('change', e => {
      const target = e.target
      if (!target.matches('select[data-field="quickFillId"]')) return
      const card = target.closest('.form-card')
      if (!card) return
      const kind = card.dataset.kind
      const item = getItem(kind, card.dataset.id)
      item.quickFillId = target.value
      if (kind === 'applicant') applyQuickFillApplicant(item)
      else applyQuickFillAgent(item)
      render()
    })

    document.addEventListener('input', e => {
      const target = e.target
      if (!target.matches('[data-array-field][data-array-index]')) return
      const card = target.closest('.form-card')
      const item = getItem(card.dataset.kind, card.dataset.id)
      const field = target.dataset.arrayField
      const idx = Number(target.dataset.arrayIndex)
      item[field][idx] = target.value
      item.saved = false
    })

    document.getElementById('addApplicantBtn').onclick = () => {
      state.applicants.push(createApplicant())
      render()
    }
    document.getElementById('addAgentBtn').onclick = () => {
      state.agents.push(createAgent())
      render()
    }
    document.getElementById('saveApplicantBtn').onclick = () => {
      state.applicants.forEach(a => a.saved = true)
      alert('申请人保存成功（静态页，本地保存）')
      render()
    }
    document.getElementById('saveAgentBtn').onclick = () => {
      state.agents.forEach(a => a.saved = true)
      alert('代理人保存成功（静态页，本地保存）')
      render()
    }
    document.getElementById('prevStepBtn').onclick = () => {
      window.location.href = './Step2SmartExtraction.html'
    }
    document.getElementById('nextStepBtn').onclick = () => {
      window.location.href = './Step4RespondentConfirmation.html'
    }

    render()
  </script>
</body>
</html>
